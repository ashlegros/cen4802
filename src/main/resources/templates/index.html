<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Task Manager</title>

    <style>
        body {
            background-color: #f2f2f2;
            max-width: 800px;
            margin: auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
        }

        .task-count {
            font-weight: bold;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            margin: 5px;
        }

        li::before {
            content: "→ ";
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Personal Task Manager</h1>

<form action="/tasks" method="post">
    <input type="text" name="title" placeholder="Enter a task title">
    <button type="submit">Add Task</button>
</form>

<h2>My Tasks</h2>

<p class="task-count">Tasks Remaining: <span th:text="${remainingTasks}"></span></p>

<ul>
    <li th:each="task : ${tasks}">
        <span th:text="${task.id}"></span>>
        -
        <span th:text="${task.title}"></span>

        <span th:if="${task.completed}">
            &check;
        </span>

        <form th:if="${task.completed == false}"
              th:action="@{/task/{id}/complete(id=${task.id})}" method="post"
              style="display: inline;">
            <button type="submit">Complete</button>
        </form>

        <form th:action="@{/task/{id}/delete(id=${task.id})}" method="post"
            style="display: inline;">
            <button type="submit">Delete</button>
        </form>
    </li>
</ul>

</body>
</html>
