<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Task Manager</title>

    <style>
        body {
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
        }

        .add-task-button {
            background-color: #b6e6df;
            border: none;
            height: 32px;
            width: 85px;
            border-radius: 10px;
            cursor: pointer;
        }
        .add-task-button:hover {
            background-color: #8bb1aa;
        }

        .task-text-box {
            text-align: center;
        }

        .task-count {
            font-weight: bold;
        }

        ul {
            list-style-type: none;
            padding-left: 0;
        }

        li {
            margin: 5px;
        }

        li::before {
            content: "→ ";
            font-weight: bold;
        }
    </style>
</head>
<body>

<h1>Personal Task Manager</h1>

<form class="task-text-box" action="/tasks" method="post">
    <input type="text" name="title" placeholder="Enter a task title">

    <select name="priority">
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
    </select>

    <button class="add-task-button" type="submit">Add Task</button>
</form>

<h2>My Tasks</h2>

<p class="task-count">Tasks Remaining: <span th:text="${remainingTasks}"></span></p>

<ul>
    <li th:each="task : ${tasks}">
        <span th:text="${task.id}"></span>

        <span th:text="${task.title}"></span>

        <span th:text="'(' + ${task.priority} + ')'"></span>

        <span th:if="${task.completed}">
            &check;
        </span>

        <form th:if="${task.completed == false}"
              th:action="@{/task/{id}/complete(id=${task.id})}" method="post"
              style="display: inline;">
            <button type="submit">Complete</button>
        </form>

        <form th:action="@{/task/{id}/delete(id=${task.id})}" method="post"
            style="display: inline;">
            <button type="submit">Delete</button>
        </form>
    </li>
</ul>

</body>
</html>
